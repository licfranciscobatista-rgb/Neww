name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Compilar la web (solo Vite, sin el servidor Express)
        env:
          VITE_BUILD_COMMIT: ${{ github.sha }}
        run: |
          npm run build:web
          node scripts/verify-web-package.cjs

      - name: Verificar tipos y regresiones
        run: |
          npm run lint
          npm run test:regression

      - name: Crear proyecto Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Compilar APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verificar contenido del APK
        run: python3 scripts/verify-apk-package.py android/app/build/outputs/apk/debug/app-debug.apk

      - name: Subir APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: jugada-offline-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
